<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>ScholarHub — India's Smartest Scholarship Platform</title>
    <meta name="description" content="Find, apply for, and win scholarships with AI-powered guidance. ScholarHub is India's most intelligent scholarship companion — 500+ scholarships, SOP generator, interview simulator, and more." />
    <meta name="keywords" content="scholarships India, scholarship portal, NSP, AICTE, scholarship finder, SOP generator, AI scholarship, college funding India" />
    <meta name="author" content="ScholarHub" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="canonical" href="https://scholarhub.in/" />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://scholarhub.in/" />
    <meta property="og:title" content="ScholarHub — India's Smartest Scholarship Platform" />
    <meta property="og:description" content="AI-powered scholarship discovery, SOP writing, interview prep, and application tracking. Trusted by 10,000+ Indian students." />
    <meta property="og:image" content="https://scholarhub.in/og-image.png" />
    <meta property="og:site_name" content="ScholarHub" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ScholarHub — India's Smartest AI Scholarship Platform" />
    <meta name="twitter:description" content="Find and win scholarships with AI tools. 500+ schemes, SOP generator, interview simulator." />
    <meta name="twitter:image" content="https://scholarhub.in/og-image.png" />

    <!-- Favicon (SVG data URI — no extra file needed) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>" />
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Preconnect + Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "ScholarHub",
      "url": "https://scholarhub.in",
      "description": "India's most intelligent AI-powered scholarship companion",
      "applicationCategory": "EducationApplication",
      "operatingSystem": "Web",
      "inLanguage": ["en", "hi"],
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "INR"
      },
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.9",
        "ratingCount": "10000"
      },
      "author": {
        "@type": "Organization",
        "name": "ScholarHub",
        "url": "https://scholarhub.in"
      }
    }
    </script>

    <style>
      /* Critical above-the-fold CSS for instant first paint */
      html { scroll-behavior: smooth; }
      body { margin: 0; padding: 0; background: #0f172a; }
      #root { min-height: 100vh; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Register Service Worker for PWA / Offline support
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
